<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" method="post" id="registrationForm" novalidate>
        <div>
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" >
        </div>

        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" >
        </div>
            
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" >
        </div>

        <div>
            <label for="course">Course Program</label>
            <select id="course" name="course">
                <option value="">----</option>
                <option value="General English">General English</option>
                <option value="IELTS Preparation">IELTS Preparation</option>
                <option value="TOEFL Preparation">TOEFL Preparation</option>
                <option value="English Conversation">English Conversation</option>
            </select>
        </div>

        <div id="feedback"></div>

        <button type="submit" id="submitButton">Register Now</button>
        <button type="button" id="cancelEditButton" hidden>
            Cancel Edit
        </button>

    </form>

    <div>
        <label for="searchStudent">Search Students: </label>
        <input type="text" name="searchStudent" id="searchStudent" placeholder="Search by name....">
    </div>

    <div>
        <label for="dataSort">Sorts</label>
        <select id="dataSort" name="dataSort">
            <option value="">----</option>
            <option value="name-asc">Name A-Z</option>
            <option value="name-desc">Name Z-A</option>
            <option value="course-asc">Course A-Z</option>
            <option value="course-desc">Course Z-A</option>
        </select>
    </div>

    <div>
        <label for="itemsPerPageSelect">Show</label>
        <select id="itemsPerPageSelect">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
        </select>
        <span>students per page</span>
    </div>

    <section>
        <h2>Registered Students <span id="studentCount"></span></h2>
        <ul id="studentList"></ul>
    </section>

    <div id="pageNumbers"></div>
    <div class="paginationMenu">
        <button id="btnPaginationPrev">Previous</button>
        <p id="paginationLabel">Page <span id="currentPage"></span> of <span id="totalPages"></span></p>
        <button id="btnPaginationNext">Next</button>
    </div>



    <script src="./script.js" defer></script>
    <!-- <script src="./test.js"></script> -->
</body>
</html>
